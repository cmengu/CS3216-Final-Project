<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="t d"><title id="t">How an invoice is checked</title><desc id="d">An invoice file is read, extracted and checked line by line against the master list, then the clerk decides. A failed step saves the invoice as failed with a reason.</desc>
<line x1="100" y1="80" x2="860" y2="80" stroke="#B84A27" stroke-width="7" stroke-linecap="round"/>
<circle cx="100" cy="80" r="9" fill="#B84A27"/>
<text x="100" y="50" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A1C15">Invoice file</text>
<text x="100" y="114" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">PDF or Vietnamese</text>
<text x="100" y="133" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">HDon XML</text>
<circle cx="290" cy="80" r="9" fill="#B84A27"/>
<text x="290" y="50" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A1C15">Read</text>
<text x="290" y="114" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">PDF: Docling OCR</text>
<text x="290" y="133" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">XML: fields read</text>
<text x="290" y="152" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">directly</text>
<circle cx="480" cy="80" r="9" fill="#B84A27"/>
<text x="480" y="50" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A1C15">Extract</text>
<text x="480" y="114" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">PDF: a model reads</text>
<text x="480" y="133" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">the printed fields</text>
<text x="480" y="152" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">XML: skipped</text>
<circle cx="670" cy="80" r="9" fill="#B84A27"/>
<text x="670" y="50" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A1C15">Check</text>
<text x="670" y="114" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">Every line against</text>
<text x="670" y="133" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">the master list</text>
<text x="670" y="152" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">version at upload</text>
<circle cx="860" cy="80" r="9" fill="#B84A27"/>
<text x="860" y="50" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A1C15">Decide</text>
<text x="860" y="114" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">The clerk, per invoice</text>
<text x="860" y="142" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">Ready to pay</text>
<text x="860" y="161" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">Raise with supplier</text>
<text x="860" y="180" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">Pay anyway</text>
<path d="M290 165 V250 H860" fill="none" stroke="#B9A99B" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M480 165 V250 M670 165 V250" fill="none" stroke="#B9A99B" stroke-width="2" stroke-dasharray="6 6"/>
<text x="310" y="278" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">A step that fails saves the invoice as failed, with the step and the reason.</text>
<text x="310" y="297" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#665247">A failed invoice can only be paid anyway, with a reason. Nothing is sent from the app.</text>
</svg>