<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily · Nothing to decide</title>
<link rel="stylesheet" href="assets/ic.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#b84a27}a:hover{color:#8f3a1e}
</style>
</head>
<body>
<div class="ic" style="height: 100vh; display: flex; flex-direction: column; background: var(--surface); position: relative; overflow: hidden">
  <header class="ic-top"><div class="ic-brand"><span class="ic-mark"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Invoice Checker</div><nav class="ic-seg" aria-label="Workspace"><button type="button"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>Master list <span class="ok"><svg class="i " viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span class="sr">ready</span></span></button><button type="button" aria-current="page"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M9 9h6M9 13h6M9 17h4"></path></svg>Invoices</button><button type="button"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>Audit trail</button></nav><button class="ic-acct" type="button" aria-label="Account"><span class="ic-av">A</span><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></header>
  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(380px, 460px) minmax(0, 1fr)">
    <aside aria-label="Invoices" style="min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 0; border-right: 1px solid var(--line); background: var(--surface)">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px"><h1 style="margin: 0; font-size: 18px; font-weight: 600">Invoices</h1><button class="ic-btn ic-btn--primary" type="button" style="min-height: 36px; padding: 0 12px"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"></path></svg>Upload</button></div>
      <label class="ic-search" style="max-width: none"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><span class="sr">Search invoices</span><input type="search" placeholder="Search"></label>
      <div class="ic-seg" role="group" aria-label="Show" style="align-self: stretch"><button type="button" aria-pressed="true" style="flex: 1; justify-content: center">To decide <span class="n">0</span></button><button type="button" aria-pressed="false" style="flex: 1; justify-content: center">Done <span class="n">14</span></button></div>
      
      <div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px"><div style="padding: 16px 4px; display: flex; flex-direction: column; gap: 12px"><span class="ic-ok"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Nothing to decide.</span></div></div>
    </aside><section aria-label="Check" style="min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 12px; padding: 32px; border-right: 1px solid var(--line)">
      <h2 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">All invoices decided</h2>
      <span class="muted" style="font-size: 14px">14 invoices decided</span>
      <div style="display: flex; gap: 12px; margin-top: 4px"><button class="ic-btn ic-btn--primary" type="button"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5"></path></svg>Upload invoice</button><a class="ic-btn ic-btn--secondary" href="#">Export ready to pay</a></div>
    </section><div style="min-height: 0; display: flex; padding: 16px; background: var(--bg)"><section class="ic-doc" aria-label="Invoice PDF" style="min-height: 0; flex: 1; border: 0; background: transparent"><div style="flex: 1; overflow: auto"><div style="height: 100%; display: flex; align-items: center; justify-content: center"><span class="muted">No invoice selected</span></div></div></section></div>
  </div>
  
</div>
</body>
</html>
