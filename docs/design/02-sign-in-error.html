<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Error</title>
<link rel="stylesheet" href="assets/ic.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#b84a27}a:hover{color:#8f3a1e}
</style>
</head>
<body>
<div class="ic" style="min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 32px; box-sizing: border-box">
  <div class="ic-brand"><span class="ic-mark"><svg class="i ui" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Invoice Checker</div>
  <main class="ic-card" style="width: 100%; max-width: 400px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0 0 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Sign in</h1>
    <div class="ic-field"><label for="em">Email</label><input class="ic-input" id="em" type="email" autocomplete="email" value="you@company.com"></div>
    <div class="ic-field"><div style="display: flex; justify-content: space-between; align-items: baseline"><label for="pw">Password</label><a href="#" style="font-size: 13px; font-weight: 600">Forgot password?</a></div><input class="ic-input ic-input--error" id="pw" type="password" autocomplete="current-password" aria-invalid="true" aria-describedby="pw-h" value="password1"><span class="ic-hint ic-hint--error" id="pw-h">Email or password is incorrect.</span></div>
    <button class="ic-btn ic-btn--primary" type="submit" style="width: 100%; min-height: 44px">Sign in</button>
    <div style="display: flex; align-items: center; gap: 12px; color: var(--ink2); font-size: 13px"><span style="flex: 1; height: 1px; background: var(--line)"></span>or<span style="flex: 1; height: 1px; background: var(--line)"></span></div>
    <button class="ic-btn ic-btn--secondary" type="button" style="width: 100%; min-height: 44px; color: var(--ink)">Continue with Google</button>
    <button class="ic-btn ic-btn--secondary" type="button" style="width: 100%; min-height: 44px; color: var(--ink)">Continue with Microsoft</button>
  </main>
</div>
</body>
</html>
