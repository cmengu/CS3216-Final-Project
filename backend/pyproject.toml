[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "invoice-processing"
version = "0.1.0"
description = "Docling invoice ingestion and reproducible mastersheet comparison"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "pypdf>=6,<7",
    "openai>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.2,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "defusedxml>=0.7,<1",
    "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
# torch and torchvision are docling's; they are named here so [tool.uv.sources] can pick the
# CPU build on Linux, which only applies to dependencies the project declares itself.
docling = ["docling==2.137.0", "onnxruntime>=1.20,<2", "torch>=2.6,<3", "torchvision>=0.21,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
dummy = ["weasyprint>=68,<71", "pypdfium2>=5,<6", "pillow>=12,<13", "openpyxl>=3.1,<4"]

[project.scripts]
invoice-process = "invoice_processing.cli:main"
invoice-dummy = "dummy.generate:main"
invoice-read = "read.cli:main"
invoice-score = "eval.cli:main"

# On Linux, take torch from PyTorch's CPU index. The PyPI build bundles the CUDA libraries,
# which add several gigabytes to a server image that has no GPU. macOS wheels are CPU already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["invoice_processing", "read", "api", "dummy", "check", "extract", "eval"]

[tool.hatch.build.targets.wheel.force-include]
"schema.py" = "schema.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docling: real conversion; downloads model weights on first run",
    "model: real OpenAI field extraction; sends only data/dummy and needs OPENAI_API_KEY",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
